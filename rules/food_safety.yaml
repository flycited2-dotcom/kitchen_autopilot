# Продукты, для которых в рецепте (шаги или safety_notes) обязательна фраза о безопасности.
# match — основы слов в названии ингредиента (с начала слова, без учёта регистра и «ё»);
# except — если в названии есть такая подстрока, правило не срабатывает (консервы, копчёное, яйца).
# Температуры внутри продукта здесь не указаны: добавлять только вместе с source_url на официальный
# источник (сайты FDA и FoodSafety.gov из облачной сессии 2026-10-28 были недоступны — не проверены).
rules:
  - id: poultry
    why: птица подаётся только полностью готовой
    match: [куриц, курин, цыпл, индейк, индюш, утк, утин]
    except: [яйц, яиц, бульон, копчен]
    require_any: ["до полной готовности", "до прозрачного сока", "сок станет прозрачным"]
  - id: minced_meat
    why: фарш и котлеты — только полностью прожаренные
    match: [фарш]
    except: []
    require_any: ["до полной готовности", "без розовых участков"]
  - id: raw_fish
    why: рыба в боулах и тартарах — либо термообработка, либо специальная рыба для сырого употребления
    match: [тунец, тунц, лосос, семг, форел]
    except: [консерв, копчен, солен, "в собственном соку", "в масле"]
    require_any: ["глубокой заморозки", "для сырого употребления", "обжарить", "обжарь", "запечь", "запеки",
                  "отварить", "до готовности", "до полной готовности"]
